{% extends "studio/base.html" %}
{% block title %}Delete — Studio{% endblock %}
{% block studio %}
<div class="auth-card flat"><h1 class="h2">Delete {{ cfg.label|lower }}?</h1><p class="muted">“{{ obj }}” will be permanently removed. This can't be undone.</p>
<form method="post" class="actions">{% csrf_token %}<button class="btn btn-danger" type="submit">Yes, delete</button><a class="btn btn-ghost" href="{% url 'dash_list' key %}">Cancel</a></form></div>
{% endblock %}
